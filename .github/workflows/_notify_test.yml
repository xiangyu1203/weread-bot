name: _Notify Channel Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test message via PushPlus
        env:
          TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          echo "Calling PushPlus send API using the repo's PUSHPLUS_TOKEN ..."
          curl -s -o /tmp/pp.json -w "HTTP %{http_code}\n" -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$TOKEN\",\"title\":\"微信通道测试\",\"content\":\"如果你收到这条消息，说明 PushPlus 微信通知通道正常可用。\"}"
          echo "--- PushPlus API response (token masked, only code/msg visible) ---"
          cat /tmp/pp.json; echo