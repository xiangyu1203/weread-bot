name: Keepalive

# 保活：定期提交一次，防止 GitHub 因 fork 长期无推送而自动禁用定时工作流。
# 2026-11-07 已因此被禁用过一次（28 天无推送），重新启用后靠此工作流保持活跃。
on:
  schedule:
    # 每 3 天 UTC 00:00 运行一次（北京时间 08:00）
    - cron: '0 0 */3 * *'

  # 手动触发
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 更新保活时间戳
        run: |
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive.txt

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive $(date -u '+%Y-%m-%d')" || echo "No changes to commit"
          git push
